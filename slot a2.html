<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Parking - Slot Menu</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121214; color: #fff; text-align: center; padding: 30px 15px; }
        .card { background: #1e1e24; max-width: 450px; margin: 20px auto; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); border-top: 5px solid #3498db; }
        h1 { color: #3498db; margin-bottom: 5px; }
        h2 { background: #2a2a32; display: inline-block; padding: 5px 20px; border-radius: 8px; margin-bottom: 25px; }
        p { font-size: 1.1rem; margin: 15px 0; color: #a0a0aa; }
        .highlight { font-weight: bold; color: #fff; }
        
        button { width: 100%; font-size: 1.1rem; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        .btn-start { background: #3498db; color: #fff; }
        .btn-start:hover { background: #2980b9; }
        .btn-pay { background: #2ecc71; color: #fff; }
        .btn-pay:hover { background: #27ae60; }
        
        .status-badge { font-weight: bold; padding: 4px 12px; border-radius: 5px; }
        .kosong { background: #2ecc71; color: #fff; }
        .terisi { background: #f1c40f; color: #121214; }
        .overtime { background: #e74c3c; color: #fff; }
        
        .timer-box { font-size: 2rem; font-weight: bold; font-family: monospace; margin: 20px 0; color: #00ffcc; }

        /* Gaya Tampilan Pop-up QRIS (Modal) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #222; padding: 30px; border-radius: 15px; max-width: 350px; width: 90%; text-align: center; border: 1px solid #333; }
        .qris-img { width: 220px; height: 220px; margin: 15px auto; background: #fff; padding: 10px; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold;}
        .qris-img img { width: 100%; height: 100%; }
        .btn-confirm { background: #e67e22; color: white; }
        .btn-cancel { background: #555; color: white; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="slot-title">Smart Parking System</h1>
        <h2 id="slot-id">SLOT -</h2>
        
        <p>Status Tempat: <span id="status-text" class="status-badge kosong">-</span></p>
        <p>Sisa Waktu Parkir:</p>
        <div id="timer-display" class="timer-box">02:00:00</div>
        
        <p>Total Biaya: <span id="biaya-display" class="highlight">Rp 0</span></p>
        <p>Status Pembayaran: <span id="bayar-text" class="highlight">-</span></p>

        <div id="button-area"></div>
    </div>

    <!-- WINDOW POP-UP MODAL QRIS SIMULASI -->
    <div id="qris-modal" class="modal">
        <div class="modal-content">
            <h3 style="color: #2ecc71; margin-bottom: 5px;">QRIS PEMBAYARAN</h3>
            <p id="modal-slot-info" style="margin: 5px 0; color: #fff; font-weight: bold;"></p>
            <p id="modal-tagihan" style="color: #f1c40f; font-size: 1.3rem; font-weight: bold; margin: 5px 0;"></p>
            
            <!-- Area Gambar QRIS Statis -->
            <div class="qris-img">
                <!-- Anda bisa mengganti URL src di bawah ini dengan link gambar QRIS Anda sendiri -->
                <img id="qris-src" src="https://qrserver.com" alt="QRIS Dummy">
            </div>
            
            <p style="font-size: 0.85rem; color: #aaa;">Scan menggunakan aplikasi m-banking atau e-wallet Anda.</p>
            <button class="btn-confirm" onclick="konfirmasiPembayaranSukses()">Saya Sudah Bayar</button>
            <button class="btn-cancel" onclick="tutupModalQRIS()">Batal</button>
        </div>
    </div>

    <!-- Firebase SDK Core -->
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
const firebaseConfig = {
    apiKey: "AIzaSyCWYvurgIZbW7RSayEBRzZcRDS1w-dnYeA",
    authDomain: "smartparkingsystem-8fae4.firebaseapp.com",
    databaseURL: "https://smartparkingsystem-8fae4-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "smartparkingsystem-8fae4",
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// SLOT FIX
const currentSlot = "A2";

document.getElementById("slot-id").innerText = `SLOT ${currentSlot}`;

const TARIF_FIXED = 5000;
const DENDA_MENIT = 2000;

let globalTimer = null;
let akumulasiTagihanAkhir = 0;

database.ref(`slots/${currentSlot}`).on("value", (snapshot) => {

    const data = snapshot.val();

    if (!data) return;

    const txtStatus = document.getElementById("status-text");
    const txtTimer = document.getElementById("timer-display");
    const txtBiaya = document.getElementById("biaya-display");
    const txtBayar = document.getElementById("bayar-text");
    const btnArea = document.getElementById("button-area");

    if (globalTimer) clearInterval(globalTimer);

    if (data.status === "KOSONG") {

        txtStatus.innerText = "KOSONG / TERSEDIA";
        txtStatus.className = "status-badge kosong";

        txtTimer.innerText = "02:00:00";

        txtBiaya.innerText = "Rp 5.000";

        txtBayar.innerText = "Belum Mulai";

        btnArea.innerHTML = `
        <button class="btn-start" onclick="mulaiParkir()">
        Mulai Parkir
        </button>
        `;

    }

    else if (data.status === "TERISI") {

        txtBayar.innerText = data.status_bayar;

        globalTimer = setInterval(() => {

            const sekarang = Math.floor(Date.now() / 1000);

            const batas =
            data.waktu_masuk + (data.durasi_menit * 60);

            const selisih = batas - sekarang;

            if (selisih > 0) {

                txtStatus.innerText = "TERISI";

                txtStatus.className =
                "status-badge terisi";

                const jam =
                Math.floor(selisih / 3600);

                const menit =
                Math.floor((selisih % 3600) / 60);

                const detik =
                selisih % 60;

                txtTimer.innerText =
                `${jam.toString().padStart(2,'0')}:`+
                `${menit.toString().padStart(2,'0')}:`+
                `${detik.toString().padStart(2,'0')}`;

                akumulasiTagihanAkhir =
                TARIF_FIXED;

            }

            else {

                txtStatus.innerText = "OVERTIME";

                txtStatus.className =
                "status-badge overtime";

                const telat =
                Math.abs(selisih);

                const lewatMenit =
                Math.floor(telat / 60);

                akumulasiTagihanAkhir =
                TARIF_FIXED +
                (lewatMenit * DENDA_MENIT);

                txtTimer.innerText =
                `+${lewatMenit} MENIT`;

            }

            txtBiaya.innerText =
            `Rp ${akumulasiTagihanAkhir.toLocaleString('id-ID')}`;

            if (data.status_bayar === "BELUM") {

                btnArea.innerHTML = `
                <button class="btn-pay"
                onclick="mintaBayar()">
                Bayar Sekarang
                </button>
                `;

            }

            else {

                btnArea.innerHTML = `
                <div style="color:#2ecc71;
                font-weight:bold;
                margin-top:15px;">

                ✓ PEMBAYARAN LUNAS

                </div>
                `;

            }

        }, 1000);

    }

});

function mulaiParkir(){

    const waktu =
    Math.floor(Date.now() / 1000);

    database.ref(`slots/${currentSlot}`).update({

        status: "TERISI",
        status_bayar: "BELUM",
        waktu_masuk: waktu,
        durasi_menit: 120,
        request_exit: false

    });

}

function mintaBayar(){

    document.getElementById("modal-slot-info")
    .innerText =
    `SLOT ${currentSlot}`;

    document.getElementById("modal-tagihan")
    .innerText =
    `Rp ${akumulasiTagihanAkhir.toLocaleString('id-ID')}`;

    document.getElementById("qris-modal")
    .style.display = "flex";

}

function tutupModalQRIS(){

    document.getElementById("qris-modal")
    .style.display = "none";

}

function konfirmasiPembayaranSukses(){

    database.ref(`slots/${currentSlot}`).update({

        status_bayar: "SUDAH"

    }).then(() => {

        alert("Pembayaran berhasil");

        tutupModalQRIS();

    });

}
</script>
</body>
